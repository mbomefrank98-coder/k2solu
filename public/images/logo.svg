<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="k2sp-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe0cf"/>
      <stop offset="0.55" stop-color="#28b8c9"/>
      <stop offset="1" stop-color="#1558b8"/>
    </linearGradient>
    <linearGradient id="k2sp-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe0cf"/>
      <stop offset="1" stop-color="#1e7fd8"/>

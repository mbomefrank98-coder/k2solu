  <rect width="200" height="200" rx="28" fill="#2b3a4e"/><rect width="200" height="200" rx="28" fill="url(#k2sp-grid)"/><rect width="200" height="200" rx="28" fill="#22303f" fill-opacity="0"/>
  <g transform="translate(100 100) rotate(-32)">

  <circle cx="100" cy="100" r="50" stroke="url(#k2sp-ring)" stroke-width="13" filter="url(#k2sp-glow)"/>
  <text x="100" y="101" text-anchor="middle" dominant-baseline="central" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="74" fill="#ffffff">K</text>
  <g transform="translate(100 100) rotate(122)">
